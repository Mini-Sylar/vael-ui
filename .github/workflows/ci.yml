name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['24']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - run: pnpm install

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./packages/ui/node_modules/playwright/package.json').version)")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - run: pnpm --filter vael-ui exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      # System libs on a cache hit — the browser binary itself is skipped,
      # this only fills in OS packages if the runner image doesn't already
      # have them.
      - run: pnpm --filter vael-ui exec playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - run: pnpm test
      # Runs once; typecheck/test:vapor/test:vapor-interop below use the
      # `:only` script variants so they don't each rebuild redundantly —
      # the plain (non-`:only`) scripts still self-build for standalone
      # local use.
      - run: pnpm build
      - run: pnpm typecheck:only
      - run: pnpm test:vapor:only
      - run: pnpm test:vapor-interop:only
      # Belt-and-suspenders alongside the local pre-push hook: the hook only
      # protects the machine that has it installed (and is skippable with
      # --no-verify); this catches a PR missing a changeset regardless of
      # either. Only meaningful on PRs — a direct push's diff against
      # origin/main is already empty by the time CI sees it.
      - name: Check for missing changeset
        if: github.event_name == 'pull_request'
        run: pnpm exec changeset status --since=origin/${{ github.base_ref }}
