name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - run: pnpm install
      - run: pnpm --filter vael-ui exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test:vapor
      - run: pnpm test:vapor-interop
